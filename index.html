<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/icon.png" />
    <title>Velvety - Косметика</title>
  </head>
  <body>
    <header>
      <img src="img/bgImage.png" alt="bgImage" class="bgImage" />
      <div class="container">
        <img src="img/Logo.png" alt="Logo" class="logo_img" />
        <nav>
          <ul class="menu">
            <li><a href="#">PAGES</a></li>
            <li><a href="#">SHOP</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">LOGIN</a></li>
            <li><a href="#">CART (0)</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero_block">
        <div class="container">
          <h1 class="h1_mainTitle">
            Let nature take care of your body and soul
          </h1>
          <button class="btnMain">
            Shop now
            <img
              src="img/Arrow_btnMain.png"
              alt="Arrow_btnMain"
              class="Arrow_btnMain"
            />
          </button>
          <img src="img/Hero_Image.png" alt="Hero_Image" class="Hero_img" />
          <img src="img/Slider.png" alt="Slider" class="Slider_img" />
        </div>
      </section>

      <section class="second-block">
        <div class="container left_part">
          <h2>Inspired by traditional knowledge and nature</h2>
          <img
            src="img/secong_blockImage.png"
            alt="secong_blockImage"
            class="secong_blockImage"
          />
        </div>
        <div class="container right_part"></div>
      </section>
    </main>
  </body>
</html>
